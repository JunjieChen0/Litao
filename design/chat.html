<!DOCTYPE html>
<html lang="zh-CN" data-layout="grid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>聊天 · 青柠集</title>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script src="shell.js"></script>
<script src="app.js"></script>
<style>
.chatbody{padding:var(--sp-5) var(--sp-5) 16px;display:flex;flex-direction:column;gap:var(--sp-3);min-height:380px}
.bubble{max-width:78%;padding:12px var(--sp-4);border-radius:var(--radius-md);font-size:var(--fs-14);line-height:1.55}
.bubble.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble.out{align-self:flex-end;background:var(--btn-primary);color:var(--on-primary);border-bottom-right-radius:4px}
.chatbar{position:fixed;left:0;right:0;bottom:0;height:83px;padding:12px var(--sp-5) 34px;display:flex;
  align-items:flex-start;gap:var(--sp-2);background:var(--surface);border-top:1px solid var(--line);z-index:30}
.chatbar input{flex:1;min-width:0;height:48px;border:1px solid var(--line);border-radius:var(--radius-pill);
  padding:0 var(--sp-4);outline:none;background:var(--bg)}
.chatbar input:focus{border-color:var(--primary)}
.chatbar .send{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:var(--btn-primary);
  display:grid;place-items:center}
.chatbar .send svg{width:20px;height:20px;fill:none;stroke:var(--on-primary);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chatmeta{text-align:center;font-size:var(--fs-12);color:var(--muted);padding:var(--sp-2)}
</style>
</head>
<body data-page="chat" data-tabbar="none">

<div class="topnav">
  <a class="iconbtn" href="messages.html" aria-label="返回"><svg class="ti" viewBox="0 0 24 24"><use href="#i-back"/></svg></a>
  <h1 id="chatname">同学</h1>
  <a class="iconbtn" href="detail.html" aria-label="商品"><svg class="ti" viewBox="0 0 24 24"><use href="#i-tag"/></svg></a>
</div>

<div class="chatmeta" id="chatitem">关于商品</div>
<div class="chatbody" id="chatlog"></div>

<div class="chatbar">
  <input id="chatinput" placeholder="说点什么…" autocomplete="off">
  <button class="send" id="chatsend" aria-label="发送"><svg viewBox="0 0 24 24"><use href="#i-send"/></svg></button>
</div>

</body>
</html>
